<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Whisper ASR Demo</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    button {
      padding: 12px 24px;
      margin-right: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1677ff;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin: 20px 0;
      color: #666;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
      min-height: 80px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>Whisper ASR Demo</h1>

  <p>点击开始，说一句话，然后点击停止。</p>

  <div>
    <button id="start">开始录音</button>
    <button id="stop" disabled>停止录音</button>
  </div>

  <div id="status">
    等待开始...
  </div>

  <div id="result">
    识别结果会显示在这里
  </div>

  <script>

    let mediaRecorder = null;
    let audioChunks = [];

    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");
    const result = document.getElementById("result");


    /**
     * 开始录音
     */
    startButton.onclick = async () => {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {

          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }

        };

        mediaRecorder.onstop = async () => {

          // 停止麦克风
          stream.getTracks().forEach(track => track.stop());

          const audioBlob = new Blob(
            audioChunks,
            {
              type: mediaRecorder.mimeType
            }
          );

          await transcribe(audioBlob);
        };

        mediaRecorder.start();

        startButton.disabled = true;
        stopButton.disabled = false;

        status.innerText = "正在录音...";

        result.innerText = "";

      } catch (error) {

        console.error(error);

        status.innerText =
          "无法访问麦克风：" + error.message;

      }

    };


    /**
     * 停止录音
     */
    stopButton.onclick = () => {

      if (!mediaRecorder) {
        return;
      }

      mediaRecorder.stop();

      startButton.disabled = false;
      stopButton.disabled = true;

      status.innerText = "正在识别...";

    };


    /**
     * 上传音频到 Python
     */
    async function transcribe(audioBlob) {

      try {

        const formData = new FormData();

        formData.append(
          "file",
          audioBlob,
          "record.webm"
        );

        const response = await fetch(
          "/transcribe",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data = await response.json();

        console.log("ASR response:", data);

        if (!data.success) {

          throw new Error(
            data.error || "识别失败"
          );

        }

        result.innerText = data.text || "没有识别到内容";

        status.innerText = "识别完成";

      } catch (error) {

        console.error(error);

        status.innerText = "识别失败";

        result.innerText =
          "错误：" + error.message;

      }

    }

  </script>

</body>

</html>
